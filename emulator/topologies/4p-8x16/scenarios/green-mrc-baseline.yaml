# green-mrc-baseline.yaml — MRC smoke test with clean fabric (4p-8x16)
#
# Purpose: Verify MRC functionality works correctly on healthy fabric
#
# Policy: health_aware_mrc (MRC-aware, uses EV health state)
# EVs used: 4 (one per plane, implied by health_aware_mrc default behavior)
# MRC enabled: yes (probes + loss feedback active)
#
# This is the green tenant MRC sanity check on the larger 4p-8x16 topology.
# All 4 planes are healthy, so:
#   - All EVs should stay in GOOD state
#   - Traffic should distribute evenly across 4 planes (~25% each)
#   - Probes should show 0% loss and healthy RTT
#   - Behavior should match round_robin (since all planes are equally healthy)
#
# Use this scenario to:
#   - Verify MRC control plane works at scale (8 spines per plane)
#   - Quick regression test after MRC code changes
#   - Validate green tenant with MRC enabled on clean fabric
#   - Baseline for comparing against fault scenarios
#
# Green tenant specifics:
#   - Leaf-decap via `End.DT6` into `Vrf-green`
#   - Inner dst is anycast `2001:db8:bbbb:<NN>::2` on all 4 NICs
#   - Simpler SID list than yellow (no extra host hop)
#
# What to look for:
#   - per_plane_sent: balanced (~25% each)
#   - All EVs in GOOD state (check MRC snapshot)
#   - 0% loss, healthy probe RTT
#
# Compare to:
#   - green-ev-spray: tests full 32-EV fan-out without MRC
#   - green-mrc-ev-spray: tests MRC with full 32-EV fan-out
#   - 4p-4x8 green-baseline: same test on smaller topology (4 spines)

name: green-mrc-baseline
description: |
  All 4 planes healthy, health_aware_mrc spray over 8 green leaf pairs.
  Probes and loss reports are exchanged but should not influence the
  weights — sanity check that enabling MRC is a no-op on a clean fabric.

flows:
  - pairs: green-pairs-8
    policy: health_aware_mrc
    rate: 500pps
    duration: 5s

faults: []

# Enable MRC with defaults. The empty block is meaningful: its presence
# is what flips the orchestrator to pass --mrc on the receivers and to
# set SRV6_MRC_CONFIG_JSON on the senders. Override individual knobs
# here if a scenario needs faster/slower probing.
mrc: {}

report:
  out: results/green-mrc-baseline.json
